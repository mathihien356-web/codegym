<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Grid Row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS Grid Row</h1>
    <p class="description">Thử thay đổi vị trí và kích thước của Grid Item</p>

    <section class="example">
        <h2>Ví dụ 1: grid-row: 1 / 3</h2>
        <div class="grid-container">
            <div class="item item1">Ô 1</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </section>

    <section class="example">
        <h2>Ví dụ 2: grid-row: 2 / 4</h2>
        <div class="grid-container grid-example2">
            <div class="item item1">Ô 1</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </section>

    <section class="example">
        <h2>Ví dụ 3: grid-row: span 2</h2>
        <div class="grid-container grid-example3">
            <div class="item item1">Ô 1</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </section>
</body>
</html>
